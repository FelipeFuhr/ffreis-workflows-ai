name: AI standardize

on:
  workflow_call:
    inputs:
      task:
        description: 'Task name to run (empty = all tasks)'
        type: string
        required: false
        default: ''
      model:
        description: 'LLM model override (default: claude-sonnet-4-6)'
        type: string
        required: false
        default: 'claude-sonnet-4-6'
      base_url:
        description: 'LLM base URL — any OpenAI-compatible endpoint'
        type: string
        required: false
        default: 'https://api.anthropic.com/v1'
      standardizer_ref:
        description: 'ffreis-workflow-ai-standardizer git ref to use'
        type: string
        required: false
        default: 'main'
      dry_run:
        description: 'Print rendered prompts without calling LLM or writing'
        type: boolean
        required: false
        default: false
      run_on_draft:
        description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
        required: false
        type: boolean
        default: false
    secrets:
      LLM_API_KEY:
        required: true
      GH_TOKEN:
        description: 'Token with contents:write + pull-requests:write on the calling repo'
        required: false

jobs:
  standardize:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Run AI standardizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          path: calling-repo
          fetch-depth: 0    # full history needed for diff_since_agents_update

      - name: Checkout standardizer
        uses: actions/checkout@v4
        with:
          repository: FelipeFuhr/ffreis-workflow-ai-standardizer
          ref: ${{ inputs.standardizer_ref }}
          path: standardizer

      - uses: actions/setup-go@v5
        with:
          go-version-file: standardizer/go.mod
          cache: true
          cache-dependency-path: standardizer/go.sum

      - name: Build standardizer
        run: make build
        working-directory: standardizer

      - name: Run standardizer
        working-directory: standardizer
        env:
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ inputs.base_url }}
          GH_TOKEN:     ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_TASK:   ${{ inputs.task }}
          INPUT_MODEL:  ${{ inputs.model }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=("--local-dir" "../calling-repo" "--repo-slug" "$GITHUB_REPOSITORY")
          [ -n "$INPUT_TASK" ]              && args+=("--task"  "$INPUT_TASK")
          [ -n "$INPUT_MODEL" ]             && args+=("--model" "$INPUT_MODEL")
          [ "$INPUT_DRY_RUN" = "true" ]     && args+=("--dry-run")
          ./bin/standardizer run "${args[@]}"
