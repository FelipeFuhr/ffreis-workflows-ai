name: AI standardize

on:
  workflow_call:
    inputs:
      task:
        description: 'Task name to run (empty = all tasks)'
        type: string
        required: false
        default: ''
      model:
        description: 'LLM model override (default: claude-sonnet-4-6)'
        type: string
        required: false
        default: 'claude-sonnet-4-6'
      base_url:
        description: 'LLM base URL — any OpenAI-compatible endpoint'
        type: string
        required: false
        default: 'https://api.anthropic.com/v1'
      standardizer_ref:
        description: 'ffreis-workflow-ai-standardizer git ref to use'
        type: string
        required: false
        default: 'main'
      dry_run:
        description: 'Print rendered prompts without calling LLM or writing'
        type: boolean
        required: false
        default: false
    secrets:
      LLM_API_KEY:
        description: 'API key for the LLM provider. Not required when dry_run is true.'
        required: false
      GH_TOKEN:
        description: 'Token with contents:write + pull-requests:write on the calling repo'
        required: false

jobs:
  standardize:
    timeout-minutes: 15
    name: Run AI standardizer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: calling-repo
          fetch-depth: 0    # full history needed for diff_since_agents_update

      - name: Checkout standardizer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: FelipeFuhr/ffreis-workflow-ai-standardizer
          ref: ${{ inputs.standardizer_ref }}
          path: standardizer

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: standardizer/go.mod
          cache: true
          cache-dependency-path: standardizer/go.sum

      - name: Build standardizer
        run: make build
        working-directory: standardizer

      - name: Run standardizer
        working-directory: standardizer
        env:
          LLM_API_KEY:    ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL:   ${{ inputs.base_url }}
          GH_TOKEN:       ${{ secrets.GH_TOKEN || github.token }}
          INPUT_TASK:     ${{ inputs.task }}
          INPUT_MODEL:    ${{ inputs.model }}
          INPUT_DRY_RUN:  ${{ inputs.dry_run }}
          INPUT_REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARGS="--local-dir ../calling-repo --repo-slug $INPUT_REPO_SLUG"
          [ -n "$INPUT_TASK" ]              && ARGS="$ARGS --task $INPUT_TASK"
          [ -n "$INPUT_MODEL" ]             && ARGS="$ARGS --model $INPUT_MODEL"
          [ "$INPUT_DRY_RUN" = "true" ]     && ARGS="$ARGS --dry-run"
          ./bin/standardizer run $ARGS
