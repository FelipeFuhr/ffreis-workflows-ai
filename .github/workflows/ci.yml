name: CI

# Self-test: dry-runs ai-standardize.yml against this repo + lints all workflow YAML.
# Per AGENTS.md: devops-*.yml are exempt from this self-test.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-local-coverage:
    permissions:
      contents: read
    uses: ffreis-org/ffreis-workflows-general/.github/workflows/general-ci-local-coverage.yml@12c41714d56ff512e8093cd96a2ab11e60aced17
    with:
      mode: defines
      enforce: true

  self-test:
    name: Self-test (dry run)
    # Mirror permissions of the called reusable workflow (ai-standardize.yml standardize job).
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ai-standardize.yml
    with:
      dry_run: true
      task: detect-drift
      # No LLM_API_KEY needed for dry-run
    secrets:
      LLM_API_KEY: placeholder-not-used-in-dry-run

  actionlint:
    permissions:
      contents: read
    uses: ffreis-org/ffreis-workflows-general/.github/workflows/general-actionlint.yml@287f836a726a35af37bd24561fc687f66eaeb92f # v1.7.0
    with:
      working-directory: "."
