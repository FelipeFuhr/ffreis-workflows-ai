name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-local-coverage:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-ci-local-coverage.yml@12c41714d56ff512e8093cd96a2ab11e60aced17
    with:
      mode: defines
      enforce: true

  self-test:
    name: Self-test (dry run)
    # Mirror permissions of the called reusable workflow (ai-standardize.yml standardize job).
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/ai-standardize.yml
    with:
      dry_run: true
      task: detect-drift
      # No LLM_API_KEY needed for dry-run
    secrets:
      LLM_API_KEY: placeholder-not-used-in-dry-run

  actionlint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
