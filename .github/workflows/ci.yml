name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  workflows-policy:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-workflows-policy.yml@a02d736d25fa99fca8b4b623af9467d7afc472a4 # v1.0.3

  codeql-actions:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@a02d736d25fa99fca8b4b623af9467d7afc472a4 # v1.0.3
    with:
      languages: actions
      source-root: .
      upload-sarif: false

  # Validates the ai-standardize pipeline end-to-end (checkout, build, prompt render)
  # without spending LLM tokens. LLM_API_KEY is not required when dry_run is true.
  self-test:
    name: Self-test ai-standardize (dry run)
    uses: ./.github/workflows/ai-standardize.yml
    with:
      dry_run: true
      task: detect-drift
    permissions:
      contents: write
      pull-requests: write
