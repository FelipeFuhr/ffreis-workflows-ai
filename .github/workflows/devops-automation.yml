name: DevOps Automation

on:
  workflow_call:
      inputs:
          run_on_draft:
            description: "Run even on draft PRs (default: skip on draft to save CI minutes)"
            required: false
            type: boolean
            default: false
          runner:
            description: |
              JSON-encoded runner label(s). Default: GitHub-hosted ubuntu-latest.
              Self-hosted homelab box (private repos only): '["self-hosted","local"]'
            required: false
            type: string
            default: '["ubuntu-latest"]'
  schedule:
    - cron: '1 10 20 * *'  # monthly scattered (was: 0 6 * * 1)

jobs:
  stale:
    if: ${{ inputs.run_on_draft || vars.CI_RUN_ON_DRAFT == 'true' || github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Mark stale issues and PRs
    # inputs.runner is only populated on workflow_call/workflow_dispatch; this
    # file also runs directly off its own `schedule:` trigger, where `inputs`
    # is empty — fall back to the default so the monthly cron doesn't break.
    runs-on: ${{ fromJson(inputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue is stale. Add a comment to keep it open.'
          stale-pr-message: 'This PR is stale. Please update or close it.'
          days-before-stale: 60
          days-before-close: 14
